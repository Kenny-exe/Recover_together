services:
  postgres:
    image: postgres:16-alpine
    container_name: recovertogether-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recovertogether
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recovertogether"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - recovertogether-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recovertogether-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/recovertogether
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-1234}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - recovertogether-network

volumes:
  postgres_data:

networks:
  recovertogether-network:
    driver: bridge
