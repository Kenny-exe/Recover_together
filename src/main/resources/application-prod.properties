# --- Production profile ------------------------------------------------------
# Activated with SPRING_PROFILES_ACTIVE=prod (docker-compose does this).
# Secrets and deployment-specific config still come from environment variables
# resolved in application.properties — this file only flips behaviour that
# should differ in production, and must stay explicit and short.

# Production logs should not carry generated SQL statements.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# When a reverse proxy handles TLS and sets X-Forwarded-* headers, honour them
# so generated URLs and client-IP based features see the real scheme/host.
# Without a proxy the headers are absent and this is inert.
server.forward-headers-strategy=framework
