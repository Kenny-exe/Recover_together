spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recovertogether}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial baseline
spring.flyway.locations=classpath:db/migration

# Hibernate DDL Validation (replacing ddl-auto=update)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-stacktrace=never
server.error.include-message=always

jwt.secret=${JWT_SECRET}
jwt.expiration=900000

# Firebase Cloud Messaging (optional). Path to the service-account JSON used to
# sign FCM HTTP v1 pushes. Leave empty to run with push disabled (no-op).
# fcm.credentials-path=./firebase-service-account.json

# Transactional email (password reset). Without spring.mail.host, reset codes
# are not delivered; set app.mail.log-reset-codes=true only for local testing.
app.mail.from=${MAIL_FROM:no-reply@recovertogether.app}
app.mail.log-reset-codes=${MAIL_LOG_RESET_CODES:false}
# spring.mail.host=smtp.example.com
# spring.mail.port=587
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# --- Production hardening ---------------------------------------------------
# Public API documentation (Swagger UI). Disable in production: DOCS_ENABLED=false
# makes /v3/api-docs and /swagger-ui/** return 404.
app.docs.enabled=${DOCS_ENABLED:true}
springdoc.api-docs.enabled=${app.docs.enabled}
springdoc.swagger-ui.enabled=${app.docs.enabled}

# IP rate limiting for the public auth endpoints: fixed 60-second window per
# client IP + path; requests over the limit get 429 + Retry-After.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.limit-per-minute=${RATE_LIMIT_PER_MINUTE:30}
# Only set trust-proxy=true behind a proxy/load balancer you control that sets
# X-Forwarded-For; otherwise attackers could spoof their IP and bypass limits.
app.rate-limit.trust-proxy=${RATE_LIMIT_TRUST_PROXY:false}

# CORS: comma-separated list of web origins allowed to call the API from a
# browser. Mobile apps need none; with nothing configured cross-origin requests
# are rejected (safe default). Example: CORS_ALLOWED_ORIGINS=https://app.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}