spring.datasource.url=jdbc:postgresql://localhost:5432/recovertogether
spring.datasource.username=postgres
spring.datasource.password=1234

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial baseline
spring.flyway.locations=classpath:db/migration

# Hibernate DDL Validation
spring.jpa.hibernate.ddl-auto=validate

jwt.secret=ThisIsOnlyATestSecretForRecoverTogether123456789
jwt.expiration=900000

# IP rate limiting is off for tests: the shared suite issues many more than 30
# login/register requests per minute. The hardening integration tests
# re-enable it with a small window in their own context.
app.rate-limit.enabled=false

# Public API docs stay enabled in tests; DocsDisabledIntegrationTest overrides
# app.docs.enabled to prove the endpoints disappear when docs are turned off.
# (The main application.properties is fully shadowed by this file, so the
# springdoc alias lines are mirrored here.)
app.docs.enabled=true
springdoc.api-docs.enabled=${app.docs.enabled}
springdoc.swagger-ui.enabled=${app.docs.enabled}