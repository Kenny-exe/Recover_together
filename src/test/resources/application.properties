spring.datasource.url=jdbc:postgresql://localhost:5432/recovertogether
spring.datasource.username=postgres
spring.datasource.password=1234

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial baseline
spring.flyway.locations=classpath:db/migration

# Hibernate DDL Validation
spring.jpa.hibernate.ddl-auto=validate

jwt.secret=ThisIsOnlyATestSecretForRecoverTogether123456789
jwt.expiration=900000